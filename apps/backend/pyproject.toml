[project]
name = "backend"
version = "0.1.0"
description = "ConceptCast Backend"
authors = [{name = "ConceptCast Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "pydantic-ai>=1.52.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.27.0",
    "manim>=0.18.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.18.4",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "ty>=0.0.1",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
check_untyped_defs = true



[dependency-groups]
dev = [
    "mypy>=1.19.1",
]
