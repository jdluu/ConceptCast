[project]
name = "backend"
version = "0.1.0"
description = "ConceptCast Backend"
authors = [{name = "ConceptCast Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "httpx>=0.28.0",
    "structlog>=25.4.0",
    "pydantic-ai>=1.84.1",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.44.0",
    "manim>=0.18.0",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "aiosqlite>=0.22.1",
    "taskiq>=0.12.2",
    "taskiq-fastapi>=0.5.0",
    "taskiq-redis>=0.5.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "ty>=0.0.1",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C90", "PL", "ARG", "PTH", "T20"]
ignore = ["E501", "PLC0415", "PLR2004"] # Line length handled by formatter, local imports allowed, magic values allowed

[tool.ruff.lint.per-file-ignores]
"src/scripts/*" = ["T201"]
"src/main.py" = ["T201"] # Allow print in main for startup messages if any

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 60

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]



[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.5",
]
